<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DirectImage - A3 Print Sheet Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Standard SVG Symbol Definitions with calibrated viewBox="0 0 24 24" -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <defs>
      <!-- Layout / Menu Grid Icon -->
      <symbol id="icon-layout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
      </symbol>

      <!-- Move / Pan -->
      <symbol id="icon-move" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 9 2 12 5 15"/>
        <polyline points="9 5 12 2 15 5"/>
        <polyline points="15 19 12 22 9 19"/>
        <polyline points="19 9 22 12 19 15"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <line x1="12" y1="2" x2="12" y2="22"/>
      </symbol>

      <!-- Center / Target View -->
      <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="7"/>
        <line x1="12" y1="2" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
      </symbol>

      <!-- Zoom In -->
      <symbol id="icon-zoom-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </symbol>

      <!-- Zoom Out -->
      <symbol id="icon-zoom-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </symbol>

      <!-- Upload Cloud -->
      <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </symbol>

      <!-- Batch Upload -->
      <symbol id="icon-batch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </symbol>

      <!-- Edit / Pen -->
      <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </symbol>

      <!-- Adjust Sliders -->
      <symbol id="icon-adjust" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"/>
        <line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/>
        <line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/>
        <line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </symbol>

      <!-- Trash / Delete -->
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </symbol>

      <!-- Print -->
      <symbol id="icon-print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </symbol>

      <!-- Chevron Down -->
      <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </symbol>

      <!-- Checkmark -->
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </symbol>

      <!-- Close / Cross -->
      <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </symbol>

      <!-- Eyedropper -->
      <symbol id="icon-pipette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2l7.5 7.5-3 3-7.5-7.5 3-3zM9 13.5L2 20.5 3.5 22l7-7-1.5-1.5z"/>
      </symbol>

      <!-- Undo / Reset -->
      <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7v6h6"/>
        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
      </symbol>

      <!-- Box -->
      <symbol id="icon-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </symbol>

      <!-- Cards Grid -->
      <symbol id="icon-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="9" height="14" rx="1.5"/>
        <rect x="13" y="6" width="9" height="14" rx="1.5"/>
      </symbol>

      <!-- Combo -->
      <symbol id="icon-combo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="5" rx="1"/>
        <rect x="2" y="10" width="8" height="11" rx="1"/>
        <rect x="12" y="10" width="10" height="11" rx="1"/>
      </symbol>
    </defs>
  </svg>

  <!-- Main App Shell -->
  <div id="app">
    
    <!-- Minimal Optimized Floating Toolbar -->
    <header class="floating-toolbar">
      
      <!-- Layout Dropdown Menu Selector -->
      <div class="dropdown-wrapper">
        <button id="btn-layout-dropdown" class="tool-btn icon-btn" title="Layout Presets (18 Cards, 4 Packaging, Combo)" aria-expanded="false">
          <svg class="svg-icon"><use href="#icon-layout"></use></svg>
          <svg class="svg-icon-xs chevron-icon"><use href="#icon-chevron-down"></use></svg>
        </button>
        
        <div id="layout-menu" class="dropdown-popover">
          <button class="dropdown-item active" data-layout="18cards">
            <svg class="svg-icon-sm"><use href="#icon-cards"></use></svg>
            <div class="dropdown-item-info">
              <span class="dropdown-title">18 Cards Sheet</span>
              <span class="dropdown-desc">6 × 3 Standard Cards (2.5" × 3.5")</span>
            </div>
            <svg class="svg-icon-xs check-indicator"><use href="#icon-check"></use></svg>
          </button>
          
          <button class="dropdown-item" data-layout="4packaging">
            <svg class="svg-icon-sm"><use href="#icon-box"></use></svg>
            <div class="dropdown-item-info">
              <span class="dropdown-title">4 Packaging Sheet</span>
              <span class="dropdown-desc">2 × 2 Tuck Box Packaging Nets (7.075" × 5.5")</span>
            </div>
            <svg class="svg-icon-xs check-indicator"><use href="#icon-check"></use></svg>
          </button>
          
          <button class="dropdown-item" data-layout="combo">
            <svg class="svg-icon-sm"><use href="#icon-combo"></use></svg>
            <div class="dropdown-item-info">
              <span class="dropdown-title">Combo Sheet</span>
              <span class="dropdown-desc">12 Cards + 1 Box (Row 1: 6 cards, Rows 2-3: 6 cards + Box)</span>
            </div>
            <svg class="svg-icon-xs check-indicator"><use href="#icon-check"></use></svg>
          </button>
        </div>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Viewport Navigation Controls -->
      <button id="btn-recenter" class="tool-btn icon-btn" title="Center Sheet">
        <svg class="svg-icon"><use href="#icon-target"></use></svg>
      </button>

      <div class="zoom-cluster">
        <button id="btn-zoom-out" class="tool-btn icon-btn-sm" title="Zoom Out">
          <svg class="svg-icon-xs"><use href="#icon-zoom-out"></use></svg>
        </button>
        <span id="zoom-display" class="zoom-text">100%</span>
        <button id="btn-zoom-in" class="tool-btn icon-btn-sm" title="Zoom In">
          <svg class="svg-icon-xs"><use href="#icon-zoom-in"></use></svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Quick Action Buttons (Icon-Only, Clean Minimal) -->
      <label for="batch-file-input" class="tool-btn icon-btn" title="Batch Upload Images">
        <svg class="svg-icon"><use href="#icon-batch"></use></svg>
        <input type="file" id="batch-file-input" multiple accept="image/*" style="display:none;" />
      </label>

      <button id="btn-clear-all" class="tool-btn icon-btn btn-danger" title="Clear All Cards">
        <svg class="svg-icon"><use href="#icon-trash"></use></svg>
      </button>

      <button id="btn-print" class="tool-btn icon-btn btn-primary" title="Print A3 Sheet">
        <svg class="svg-icon"><use href="#icon-print"></use></svg>
      </button>

    </header>

    <!-- Infinite Draggable & Zoomable Canvas Workspace -->
    <main id="infinite-workspace" class="infinite-canvas">
      
      <!-- Transform Container (Manipulated by Pan & Zoom / Touch Gestures) -->
      <div id="canvas-transformer">
        
        <!-- White A3 Master Sheet (420mm x 297mm) -->
        <div id="a3-sheet" class="a3-sheet-container">
          
          <!-- Dynamic Sheet Grid Container -->
          <div id="sheet-slots-container" class="sheet-grid layout-18cards">
            <!-- Rendered dynamically by app.js -->
          </div>

        </div>

      </div>

    </main>

    <!-- Hidden Individual File Input (Triggered per card) -->
    <input type="file" id="single-file-input" accept="image/*" style="display: none;" />

    <!-- Floating Modal: Card Image Placement & Color Customizer -->
    <div id="edit-modal" class="modal-backdrop" style="display: none;">
      <div class="floating-editor-window">
        
        <!-- Window Header -->
        <div class="editor-header">
          <div class="editor-title">
            <svg class="svg-icon-sm"><use href="#icon-adjust"></use></svg>
            <span id="editor-card-title">Edit Placement & Color</span>
          </div>
          <button id="modal-btn-close" class="editor-close-btn" title="Close">
            <svg class="svg-icon-xs"><use href="#icon-x"></use></svg>
          </button>
        </div>

        <!-- Window Body -->
        <div class="editor-body">
          
          <!-- Live Interactive Preview Panel -->
          <div class="editor-preview-panel">
            <div class="preview-stage-container">
              <div id="editor-preview-card" class="editor-preview-card">
                <div id="editor-preview-content" class="editor-preview-content">
                  <img id="editor-preview-img" src="" alt="Preview" draggable="false" />
                </div>
                <div class="preview-drag-guide">
                  <svg class="svg-icon-xs"><use href="#icon-move"></use></svg>
                  <span>Drag image to position</span>
                </div>
              </div>
            </div>
            <div class="preview-metrics">
              <span id="editor-metric-fit">Fit: Contain</span>
              <span id="editor-metric-scale">Scale: 100%</span>
              <span id="editor-metric-pos">Pos: (0px, 0px)</span>
            </div>
          </div>

          <!-- Controls Panel -->
          <div class="editor-controls-panel">
            
            <!-- Fit Preset Modes -->
            <div class="control-group">
              <label class="control-label">Fit Mode</label>
              <div class="segmented-control">
                <button type="button" class="segment-btn active" data-fit="contain">Contain</button>
                <button type="button" class="segment-btn" data-fit="cover">Cover</button>
                <button type="button" class="segment-btn" data-fit="stretch">Stretch</button>
                <button type="button" class="segment-btn" data-fit="custom">Custom</button>
              </div>
            </div>

            <!-- Zoom / Scale Slider -->
            <div class="control-group">
              <div class="label-with-value">
                <label class="control-label">Scale / Zoom</label>
                <span id="val-scale" class="control-value">100%</span>
              </div>
              <div class="slider-row">
                <input type="range" id="input-scale" min="10" max="300" step="1" value="100" />
                <button type="button" class="control-mini-btn" id="btn-scale-reset" title="Reset Zoom to 100%">1:1</button>
              </div>
            </div>

            <!-- Position X / Y Sliders -->
            <div class="control-group">
              <div class="label-with-value">
                <label class="control-label">Position Offset</label>
                <button type="button" class="control-text-btn" id="btn-pos-center">Center</button>
              </div>
              <div class="dual-slider-grid">
                <div class="slider-item">
                  <span class="sub-label">X: <span id="val-pos-x">0px</span></span>
                  <input type="range" id="input-pos-x" min="-180" max="180" step="1" value="0" />
                </div>
                <div class="slider-item">
                  <span class="sub-label">Y: <span id="val-pos-y">0px</span></span>
                  <input type="range" id="input-pos-y" min="-180" max="180" step="1" value="0" />
                </div>
              </div>
            </div>

            <!-- Rotation & Flip -->
            <div class="control-group">
              <div class="label-with-value">
                <label class="control-label">Rotation & Flip</label>
                <span id="val-rot" class="control-value">0°</span>
              </div>
              <div class="rot-buttons-row">
                <button type="button" class="tool-btn btn-sm" id="btn-rot-0">0°</button>
                <button type="button" class="tool-btn btn-sm" id="btn-rot-90">90°</button>
                <button type="button" class="tool-btn btn-sm" id="btn-rot-180">180°</button>
                <button type="button" class="tool-btn btn-sm" id="btn-rot-270">270°</button>
                <button type="button" class="tool-btn btn-sm" id="btn-flip-h" title="Flip Horizontal">Flip X</button>
                <button type="button" class="tool-btn btn-sm" id="btn-flip-v" title="Flip Vertical">Flip Y</button>
              </div>
            </div>

            <!-- Background Color Picker -->
            <div class="control-group">
              <div class="label-with-value">
                <label class="control-label">Card Background Color</label>
                <span id="val-bg-hex" class="control-value">#FFFFFF</span>
              </div>
              
              <div class="color-picker-row">
                <div class="color-input-wrapper">
                  <input type="color" id="input-bg-color" value="#ffffff" />
                  <span class="color-preview-swatch" id="swatch-preview"></span>
                </div>
                <input type="text" id="input-bg-hex" class="hex-text-input" value="#FFFFFF" maxlength="9" />
                <button type="button" class="tool-btn btn-sm icon-btn" id="btn-eyedropper" title="Pick color from screen">
                  <svg class="svg-icon-xs"><use href="#icon-pipette"></use></svg>
                </button>
              </div>

              <!-- Fast Palette Swatches -->
              <div class="palette-swatches">
                <button type="button" class="swatch-btn" data-color="#ffffff" style="background:#ffffff;" title="Pure White"></button>
                <button type="button" class="swatch-btn" data-color="#f8fafc" style="background:#f8fafc;" title="Off-White"></button>
                <button type="button" class="swatch-btn" data-color="#f1f5f9" style="background:#f1f5f9;" title="Light Slate"></button>
                <button type="button" class="swatch-btn" data-color="#fef3c7" style="background:#fef3c7;" title="Warm Cream"></button>
                <button type="button" class="swatch-btn" data-color="#fee2e2" style="background:#fee2e2;" title="Soft Rose"></button>
                <button type="button" class="swatch-btn" data-color="#e0f2fe" style="background:#e0f2fe;" title="Soft Sky"></button>
                <button type="button" class="swatch-btn" data-color="#1e293b" style="background:#1e293b;" title="Dark Navy"></button>
                <button type="button" class="swatch-btn" data-color="#000000" style="background:#000000;" title="Jet Black"></button>
                <button type="button" class="swatch-btn transparent-swatch" data-color="transparent" title="Transparent"></button>
              </div>
            </div>

          </div>

        </div>

        <!-- Window Footer -->
        <div class="editor-footer">
          <button type="button" class="tool-btn text-muted" id="modal-btn-reset">
            <svg class="svg-icon-xs"><use href="#icon-undo"></use></svg>
            <span>Reset</span>
          </button>
          <div class="footer-action-group">
            <button type="button" class="tool-btn" id="modal-btn-cancel">Cancel</button>
            <button type="button" class="tool-btn btn-primary" id="modal-btn-apply">
              <svg class="svg-icon-xs"><use href="#icon-check"></use></svg>
              <span>Apply</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
