<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yaadcard editor (A4)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- KaTeX LaTeX Formula Rendering Support -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="style_a4.css">
</head>
<body>

  <div class="editor-workspace">
    <div class="premium-card">
      <!-- simulated tuck box crop lines -->
      <div class="crop-mark top-left-crop"></div>
      <div class="crop-mark top-right-crop"></div>
      <div class="crop-mark bottom-left-crop"></div>
      <div class="crop-mark bottom-right-crop"></div>

      <!-- Color Stripe Accent mirroring Tuck box designs -->
      <div class="tuck-color-stripe" style="display: flex !important; gap: 4px !important; margin-bottom: 24px !important; width: 100% !important; height: 6px !important; overflow: hidden !important;">
        <span class="stripe-bar cyan-bar" style="flex: 1 !important; height: 100% !important; background-color: #06b6d4 !important;"></span>
        <span class="stripe-bar orange-bar" style="flex: 1 !important; height: 100% !important; background-color: #f97316 !important;"></span>
        <span class="stripe-bar purple-bar" style="flex: 1 !important; height: 100% !important; background-color: #a855f7 !important;"></span>
        <span class="stripe-bar emerald-bar" style="flex: 1 !important; height: 100% !important; background-color: #10b981 !important;"></span>
        <span class="stripe-bar gold-bar" style="flex: 1 !important; height: 100% !important; background-color: #eab308 !important;"></span>
      </div>
      
      <!-- HEADER -->
      <div class="card-header-ui">
        <div class="brand">
          <h2>yaadcard editor</h2>
          <span class="badge">A4 Landscape</span>
        </div>
        <div class="toggle-pill">
          <a href="index.html" class="pill-btn">A3</a>
          <a href="a4.html" class="pill-btn active">A4</a>
        </div>
      </div>

      <!-- MAIN CONTROLS -->
      <div class="card-body-ui">
        
        <!-- STEP 1: ACTIONS -->
        <div class="step-section">
          <div class="action-buttons">
            <button class="btn btn-gradient" id="copy-prompt-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <span>Copy Prompt</span>
            </button>
            <button class="btn btn-secondary" id="paste-validate-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M9 14h6"/><path d="M9 16h6"/><path d="M9 10h6"/><path d="M9 12h6"/></svg>
              <span>Paste & Validate</span>
            </button>
          </div>
        </div>

        <!-- STEP 2: PASTE JSON -->
        <div class="step-section">
          <div class="textarea-container">
            <textarea id="json-input" placeholder="Paste generated JSON here..."></textarea>
            <div id="validation-status" class="validation-badge"></div>
          </div>
        </div>

        <!-- STEP 3: STATS & PRINT -->
        <div class="step-section">
          <div class="stats-row">
            <div class="stat-lbl">Sheets Count</div>
            <div class="stat-val" id="est-sheets">0 sheets</div>
          </div>
          
          <div class="action-buttons">
            <button class="btn btn-secondary" id="load-sample-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
              <span>Load Sample</span>
            </button>
            
            <button class="btn btn-primary" id="print-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
              <span>Print A4 Deck</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- PRINT CONTAINER -->
  <div id="print-area"></div>

  <script src="sample_data.js"></script>
  <script src="app_a4.js"></script>
</body>
</html>
